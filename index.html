<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>런칭 타임라인 · ASISTOBE</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{
    --bg:#F2F4F6; --card:#FFFFFF; --ink:#191F28; --sub:#4E5968; --hint:#8B95A1;
    --line:#E5E8EB; --primary:#3182F6; --primary-bg:#E8F3FF;
    --t:#0F6E56; --t-bar:#7DD3B3; --t-bg:#E6F6EF;
    --b:#1B64DA; --b-bar:#92BDF0; --b-bg:#E9F2FD;
    --p:#5B53C6; --p-bar:#BBB6F0; --p-bg:#EFEEFD;
    --c:#C24A21; --c-bar:#F2A988; --c-bg:#FCEDE6;
    --r:20px; --r-sm:12px;
    --shadow:0 1px 3px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.04);
    font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.5;padding-bottom:56px}
  .wrap{max-width:1000px;margin:0 auto;padding:0 20px}

  #topbar{position:fixed;top:0;left:0;right:0;height:3px;background:transparent;z-index:100;opacity:0;transition:opacity .3s}
  #topbar.active{opacity:1}
  #topfill{display:block;height:100%;width:0;background:var(--primary);border-radius:0 3px 3px 0}

  .top{padding:30px 0 6px}
  .eyebrow{font-size:13px;font-weight:700;color:var(--primary);letter-spacing:.02em}
  h1{font-size:30px;font-weight:800;letter-spacing:-.03em;margin-top:4px}
  .top p{color:var(--hint);font-size:14px;margin-top:6px;font-weight:500}
  .synced{display:inline-flex;align-items:center;gap:6px;margin-top:10px;background:var(--t-bg);color:var(--t);
    font-size:12.5px;font-weight:700;padding:7px 12px;border-radius:999px}
  .synced .dot{width:7px;height:7px;border-radius:50%;background:#15B86A}

  .controls{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:16px 0 6px}
  .sortbox{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);
    border-radius:var(--r-sm);padding:10px 14px;box-shadow:var(--shadow)}
  .sortbox label{font-size:13px;font-weight:700;color:var(--sub)}
  .sortbox select{border:none;font-family:inherit;font-size:14px;font-weight:700;color:var(--ink);background:transparent;outline:none;cursor:pointer}
  .addbtn{margin-left:auto;font-family:inherit;font-size:14px;font-weight:700;color:#fff;background:var(--primary);
    border:none;border-radius:var(--r-sm);padding:11px 18px;cursor:pointer;box-shadow:var(--shadow);transition:.15s}
  .addbtn:active{transform:scale(.96)}

  .summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
  @media(max-width:640px){.summary{grid-template-columns:repeat(2,1fr)}}
  .stat{background:var(--card);border-radius:var(--r);padding:13px 18px;box-shadow:var(--shadow)}
  .stat .n{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1}
  .stat .l{font-size:13px;font-weight:600;color:var(--hint);margin-top:5px}
  .stat.done .n{color:#15B86A} .stat.prog .n{color:var(--primary)}
  .stat.delay .n{color:#F04452} .stat.todo .n{color:var(--sub)}
  .progress{background:var(--card);border-radius:var(--r);padding:14px 18px;margin-top:10px;box-shadow:var(--shadow)}
  .progress .row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
  .progress .row b{font-size:15px;font-weight:800}
  .progress .row span{font-size:13px;font-weight:600;color:var(--hint)}
  .bar{height:10px;background:var(--bg);border-radius:999px;overflow:hidden}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,#15B86A,#2AC1BC);border-radius:999px;transition:width .4s ease}

  .addcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 18px;
    margin-top:11px;box-shadow:var(--shadow);display:none}
  .addcard.open{display:block}
  .fldgrid{display:grid;grid-template-columns:1.6fr 1fr 1fr 1.1fr 1.1fr .8fr auto;gap:10px;align-items:end}
  @media(max-width:760px){.fldgrid{grid-template-columns:1fr 1fr}}
  .fld{display:flex;flex-direction:column;gap:5px}
  .fld label{font-size:12px;font-weight:700;color:var(--hint)}
  .fld input,.fld select{font-family:inherit;font-size:14px;font-weight:600;color:var(--ink);background:var(--bg);
    border:1px solid var(--line);border-radius:10px;padding:9px 11px;outline:none}
  .fld input:focus,.fld select:focus{border-color:var(--primary)}
  .savebtn{font-family:inherit;font-size:14px;font-weight:700;color:#fff;background:var(--primary);border:none;
    border-radius:10px;padding:10px 18px;cursor:pointer;height:38px}
  .cancelbtn{font-family:inherit;font-size:14px;font-weight:700;color:var(--sub);background:var(--bg);
    border:1px solid var(--line);border-radius:10px;padding:10px 18px;cursor:pointer;height:38px}

  .filters{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 10px}
  .chip{font-family:inherit;font-size:13.5px;font-weight:700;padding:9px 16px;border-radius:999px;
    border:1px solid var(--line);background:var(--card);color:var(--sub);cursor:pointer;transition:.15s;box-shadow:var(--shadow)}
  .chip:active{transform:scale(.96)}
  .chip[data-on="1"].all{background:var(--ink);color:#fff;border-color:var(--ink)}
  .chip.t[data-on="1"]{background:var(--t-bg);color:var(--t);border-color:var(--t-bar)}
  .chip.b[data-on="1"]{background:var(--b-bg);color:var(--b);border-color:var(--b-bar)}
  .chip.p[data-on="1"]{background:var(--p-bg);color:var(--p);border-color:var(--p-bar)}
  .chip.c[data-on="1"]{background:var(--c-bg);color:var(--c);border-color:var(--c-bar)}

  .panel{background:var(--card);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);margin-top:11px}
  .panel h2{font-size:18px;font-weight:800;letter-spacing:-.02em;margin-bottom:4px}
  .panel .sub{font-size:13px;color:var(--hint);font-weight:500;margin-bottom:13px}
  .tabs{display:inline-flex;background:#E9ECEF;border-radius:999px;padding:4px;gap:4px;margin-top:14px}
  .tab{font-family:inherit;font-size:14px;font-weight:700;color:var(--sub);background:transparent;border:none;border-radius:999px;padding:9px 26px;cursor:pointer;transition:.15s}
  .tab.active{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
  .panel.hidden{display:none}

  .gscroll{overflow-x:auto;margin:0 -4px;padding:0 4px}
  .gantt{min-width:760px}
  .grow{display:grid;grid-template-columns:200px 1fr;align-items:center}
  .ghead .htrack{display:grid}
  .ghead .wc{text-align:center;padding:0 0 8px;font-size:11px;font-weight:700;color:var(--sub);border-left:1px solid var(--line)}
  .glabel{font-size:13.5px;font-weight:600;padding:5px 12px 5px 0;display:flex;align-items:center;gap:8px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dot8{width:8px;height:8px;border-radius:3px;flex:none}
  .dot8.t{background:var(--t-bar)} .dot8.b{background:var(--b-bar)} .dot8.p{background:var(--p-bar)} .dot8.c{background:var(--c-bar)}
  .gtrack{position:relative;height:34px}
  .gbar{position:absolute;top:5px;height:24px;border-radius:8px;display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:800;cursor:pointer;transition:.2s;min-width:10px;box-sizing:border-box;overflow:hidden}
  .gbar.t{background:var(--t-bar);color:#0a4838} .gbar.b{background:var(--b-bar);color:#0b3f8c}
  .gbar.p{background:var(--p-bar);color:#3a338c} .gbar.c{background:var(--c-bar);color:#7a2e12}
  .gbar.mile{box-shadow:inset 0 0 0 2px rgba(0,0,0,.35)}

  .list{display:flex;flex-direction:column;gap:8px}
  .item{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;
    border:1px solid var(--line);border-radius:14px;padding:11px 16px;transition:.15s}
  .item:hover{border-color:#D6DBDF;background:#FBFCFD}
  .badge{font-size:11px;font-weight:800;padding:5px 10px;border-radius:8px;white-space:nowrap}
  .badge.t{background:var(--t-bg);color:var(--t)} .badge.b{background:var(--b-bg);color:var(--b)}
  .badge.p{background:var(--p-bg);color:var(--p)} .badge.c{background:var(--c-bg);color:var(--c)}
  .item .name{font-size:14.5px;font-weight:700;letter-spacing:-.01em}
  .item .name .star{color:#C24A21;margin-right:3px}
  .item .meta{font-size:12.5px;color:var(--hint);font-weight:600;margin-top:3px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .asg{font-family:inherit;font-size:12px;font-weight:600;color:var(--sub);background:var(--bg);
    border:1px solid var(--line);border-radius:7px;padding:3px 8px;outline:none;width:110px}
  .asg:focus{border-color:var(--primary)}
  .actions{display:flex;align-items:center;gap:8px}
  .status{font-family:inherit;font-size:12.5px;font-weight:800;padding:8px 14px;border-radius:999px;
    border:none;cursor:pointer;white-space:nowrap;transition:.15s;min-width:74px}
  .status:active{transform:scale(.95)}
  .status[data-s="미착수"]{background:var(--bg);color:var(--sub)}
  .status[data-s="진행중"]{background:var(--primary-bg);color:var(--primary)}
  .status[data-s="완료"]{background:#E5F8EF;color:#15B86A}
  .status[data-s="지연"]{background:#FFECEC;color:#F04452}
  .edit{font-family:inherit;font-size:14px;background:transparent;border:none;cursor:pointer;padding:4px 8px;border-radius:8px;transition:.15s}
  .edit:hover{background:var(--primary-bg)}
  .del{font-family:inherit;font-size:16px;font-weight:700;color:var(--hint);background:transparent;border:none;cursor:pointer;padding:4px 8px;border-radius:8px;transition:.15s}
  .del:hover{background:#FFECEC;color:#F04452}
  .item.editing{display:block;border-color:var(--primary)}
  .edit-grid{display:grid;grid-template-columns:1fr 1fr 1.1fr 1.1fr .8fr;gap:10px;align-items:end}
  @media(max-width:560px){.edit-grid{grid-template-columns:1fr 1fr}}
  .edit-actions{grid-column:1/-1;display:flex;gap:8px;justify-content:flex-end;margin-top:4px}

  .empty{text-align:center;color:var(--hint);font-size:14px;font-weight:600;padding:40px 0}
  .errbox{background:#FFECEC;border:1px solid #FAD2D2;color:#C0392B;border-radius:var(--r);padding:20px;
    font-size:14px;font-weight:600;margin-top:14px;line-height:1.7}
  .errbox button{margin-top:10px;font-family:inherit;font-weight:700;background:#F04452;color:#fff;border:none;border-radius:10px;padding:9px 16px;cursor:pointer}

  #toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);opacity:0;
    background:var(--ink);color:#fff;font-size:13.5px;font-weight:700;padding:12px 20px;border-radius:999px;
    box-shadow:0 8px 24px rgba(0,0,0,.18);transition:.25s;z-index:200;pointer-events:none}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  #toast.err{background:#F04452}

  footer{text-align:center;color:var(--hint);font-size:12.5px;font-weight:600;margin-top:26px}
</style>
</head>
<body>
<div id="topbar"><i id="topfill"></i></div>
<div class="wrap">

  <div class="top">
    <div class="eyebrow">ASISTOBE · 마이크로바이옴 팩클렌저</div>
    <h1>런칭 타임라인</h1>
    <p>시작일·종료일·기간을 입력하면 서로 맞춰 자동 계산됩니다. 모두 구글 시트에 저장돼요.</p>
    <div class="synced"><span class="dot"></span>구글 시트 연동됨</div>
  </div>

  <div class="controls">
    <div class="sortbox">
      <label>정렬</label>
      <select id="sort">
        <option value="start">시작일 순</option>
        <option value="end">종료일 순</option>
        <option value="dur">기간 순</option>
        <option value="stage">단계별</option>
      </select>
    </div>
    <button class="addbtn" id="toggleAdd">+ 작업 추가</button>
  </div>

  <div class="addcard" id="addcard">
    <div class="fldgrid">
      <div class="fld"><label>작업명</label><input type="text" id="f_name" placeholder="예: 인플루언서 2차 시딩"></div>
      <div class="fld"><label>단계</label>
        <select id="f_stage"><option>생산·공급</option><option>인증·임상</option><option>콘텐츠·디자인</option><option>마케팅·런칭</option></select></div>
      <div class="fld"><label>유형</label>
        <select id="f_type"><option>진행</option><option>착수</option><option>마일스톤</option></select></div>
      <div class="fld"><label>시작일</label><input type="date" id="f_start" value="2026-06-08"></div>
      <div class="fld"><label>종료일</label><input type="date" id="f_end" value="2026-06-14"></div>
      <div class="fld"><label>기간(일)</label><input type="number" id="f_dur" min="1" value="7"></div>
      <button class="savebtn" id="doAdd">추가</button>
    </div>
  </div>

  <div class="summary" id="summary"></div>
  <div class="progress">
    <div class="row"><b id="pctLabel">진행률 0%</b><span id="pctSub">완료 0 / 0</span></div>
    <div class="bar"><i id="pctBar" style="width:0%"></i></div>
  </div>

  <div class="filters" id="filters"></div>

  <div id="errSlot"></div>

  <div class="tabs" id="tabs">
    <button class="tab active" data-tab="gantt">간트</button>
    <button class="tab" data-tab="list">리스트</button>
  </div>

  <div class="panel" id="panel-gantt">
    <div class="sub">막대를 클릭하면 상태가 바뀝니다 · ★ 진한 테두리 = 마일스톤</div>
    <div class="gscroll"><div class="gantt" id="gantt"></div></div>
  </div>

  <div class="panel hidden" id="panel-list">
    <div class="sub">✏️ 수정 · 상태 클릭 = 순환 · 담당 입력 후 칸 밖 클릭 = 저장 · ✕ = 삭제</div>
    <div class="list" id="list"></div>
  </div>

  <footer>ASISTOBE 마이크로바이옴 팩클렌저 · 런칭 타임라인</footer>
</div>
<div id="toast"></div>

<script>
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxf2bo8LQ57Vu6fjPmrVug7JeGdSR3n_3qSjPti5naB1fifFpaFGJohGC_vGFPUFaRV6g/exec';
const SECRET_KEY = 'olive-asistobe-2026';
const PAL = ["t","b","p","c"];
const STAGE_PAL = {"생산":"t","생산·공급":"t","인증·임상":"b","임상":"b","디자인":"p","콘텐츠·디자인":"p","마케팅":"c","마케팅·런칭":"c"};
const PREF = ["생산","생산·공급","인증·임상","임상","디자인","콘텐츠·디자인","마케팅","마케팅·런칭","런칭 준비"];
let STAGES = [];
const STATUSES = ["미착수","진행중","완료","지연"];
function computeStages(){
  const set=[]; STATE.tasks.forEach(t=>{ if(t.stage && set.indexOf(t.stage)<0) set.push(t.stage); });
  set.sort((a,b)=>{ const ia=PREF.indexOf(a),ib=PREF.indexOf(b); return (ia<0?99:ia)-(ib<0?99:ib); });
  STAGES=set;
}
function stageColor(s){ return STAGE_PAL[s] || PAL[((STAGES.indexOf(s))%4+4)%4] || "t"; }

const STATE = { tasks:[], loaded:false };
const active = new Set();
let sortKey = "start";
let editingId = null;

const $ = s=>document.querySelector(s);

// ── loading bar (0→90→100, once) ──
const topbar=$("#topbar"), topfill=$("#topfill");
let _pending=0,_loadTimer=null;
function startLoad(){ clearInterval(_loadTimer); topbar.classList.add("active"); topfill.style.transition="width .2s ease"; topfill.style.width="0%"; let w=0;
  _loadTimer=setInterval(()=>{ w+=Math.max(0.5,(90-w)*0.12); if(w>=90){w=90;clearInterval(_loadTimer);} topfill.style.width=w.toFixed(1)+"%"; },80); }
function endLoad(){ clearInterval(_loadTimer); topfill.style.width="100%"; setTimeout(()=>{ topbar.classList.remove("active"); topfill.style.transition="none"; topfill.style.width="0%"; },280); }
function load(on){ if(on){ _pending++; if(_pending===1) startLoad(); } else { _pending=Math.max(0,_pending-1); if(_pending===0) endLoad(); } }
function toast(msg,err){ const t=$("#toast"); t.textContent=msg; t.className=(err?"err ":"")+"show"; setTimeout(()=>t.className=t.className.replace("show",""),2200); }

// ── API ──
async function apiGetAll(){ const res=await fetch(APPS_SCRIPT_URL+'?action=all'); const j=await res.json(); if(!j.ok) throw new Error(j.error||'load error'); return j.data; }
async function apiPost(p){ const res=await fetch(APPS_SCRIPT_URL,{method:'POST',body:JSON.stringify(Object.assign({secret:SECRET_KEY},p))}); const j=await res.json(); if(!j.ok) throw new Error(j.error||'API error'); return j; }

// ── date helpers ──
function pIso(s){ return new Date(String(s).slice(0,10)+'T00:00:00'); }
function fmtISO(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function diffDays(a,b){ return Math.round((b-a)/86400000); }
function fmtMD(d){ return (d.getMonth()+1)+'.'+d.getDate(); }
function fmtSlash(d){ return (d.getMonth()+1)+'/'+d.getDate(); }
function mondayOnBefore(d){ const x=new Date(d); const off=(x.getDay()+6)%7; return addDays(x,-off); }

function norm(r){
  let start=String(r.start_date||'').slice(0,10);
  let end=String(r.end_date||'').slice(0,10);
  if(!start && end) start=end; if(!end && start) end=start;
  if(!start && !end){ start='2026-06-08'; end='2026-06-08'; }
  let dur=Number(r.duration); if(!dur||dur<1) dur=diffDays(pIso(start),pIso(end))+1;
  return { id:r.task_id, stage:r.stage, name:r.name, type:r.type, start, end, duration:dur,
    assignee:r.assignee||'', status:STATUSES.includes(r.status)?r.status:'미착수' };
}
function visible(){
  let r=STATE.tasks.filter(t=>active.has(t.stage));
  if(sortKey==="start") r.sort((a,b)=>a.start<b.start?-1:a.start>b.start?1:(a.end<b.end?-1:1));
  else if(sortKey==="end") r.sort((a,b)=>a.end<b.end?-1:a.end>b.end?1:0);
  else if(sortKey==="dur") r.sort((a,b)=>b.duration-a.duration);
  else r.sort((a,b)=>STAGES.indexOf(a.stage)-STAGES.indexOf(b.stage)||(a.start<b.start?-1:1));
  return r;
}

function renderSummary(){
  const c={"미착수":0,"진행중":0,"완료":0,"지연":0};
  STATE.tasks.forEach(t=>c[t.status]=(c[t.status]||0)+1);
  const cls={"미착수":"todo","진행중":"prog","완료":"done","지연":"delay"};
  $("#summary").innerHTML=STATUSES.map(s=>`<div class="stat ${cls[s]}"><div class="n">${c[s]}</div><div class="l">${s}</div></div>`).join("");
  const total=STATE.tasks.length, pct=total?Math.round(c["완료"]/total*100):0;
  $("#pctBar").style.width=pct+"%"; $("#pctLabel").textContent="진행률 "+pct+"%"; $("#pctSub").textContent="완료 "+c["완료"]+" / "+total;
}

function renderGantt(){
  const rows=visible();
  if(!rows.length){ $("#gantt").innerHTML=`<div class="empty">표시할 작업이 없습니다.</div>`; return; }
  let minS=pIso(rows[0].start), maxE=pIso(rows[0].end);
  rows.forEach(t=>{ const s=pIso(t.start),e=pIso(t.end); if(s<minS)minS=s; if(e>maxE)maxE=e; });
  const axisStart=mondayOnBefore(minS);
  let weeks=Math.ceil((diffDays(axisStart,maxE)+1)/7); if(weeks<1) weeks=1;
  const totalDays=weeks*7;
  const colpct=100/weeks;
  let headCells="";
  for(let i=0;i<weeks;i++) headCells+=`<div class="wc">${fmtSlash(addDays(axisStart,i*7))}</div>`;
  const head=`<div class="grow ghead"><div></div><div class="htrack" style="grid-template-columns:repeat(${weeks},1fr)">${headCells}</div></div>`;
  const gridBg=`background-image:repeating-linear-gradient(to right,var(--line) 0 1px,transparent 1px calc(100%/${weeks}))`;
  const body=rows.map(t=>{
    const sc=stageColor(t.stage), mile=t.type==="마일스톤";
    const left=diffDays(axisStart,pIso(t.start))/totalDays*100;
    const width=t.duration/totalDays*100;
    const bar=`<div class="gbar ${sc}${mile?' mile':''}" style="left:${left}%;width:${width}%" data-id="${t.id}" title="${t.name} · ${t.start} ~ ${t.end} (${t.duration}일)">${mile?'★':''}</div>`;
    return `<div class="grow"><div class="glabel"><span class="dot8 ${sc}"></span>${mile?'★ ':''}${t.name}</div><div class="gtrack" style="${gridBg}">${bar}</div></div>`;
  }).join("");
  $("#gantt").innerHTML=head+body;
  $("#gantt").querySelectorAll(".gbar").forEach(b=>b.onclick=()=>cycle(b.dataset.id));
}

function stageOptions(sel){ return STAGES.map(s=>`<option${s===sel?' selected':''}>${s}</option>`).join(''); }
function typeOptions(sel){ return ['진행','착수','마일스톤'].map(s=>`<option${s===sel?' selected':''}>${s}</option>`).join(''); }

function renderFilters(){
  let html=`<button class="chip all" data-stage="all" data-on="${active.size===STAGES.length?'1':'0'}">전체</button>`;
  STAGES.forEach(s=>{ html+=`<button class="chip ${stageColor(s)}" data-stage="${s}" data-on="${active.has(s)?'1':'0'}">${s}</button>`; });
  const f=$("#filters"); f.innerHTML=html;
  f.querySelectorAll(".chip").forEach(ch=>{
    ch.onclick=()=>{ const st=ch.dataset.stage;
      if(st==="all"){ const on=ch.dataset.on!=="1"; STAGES.forEach(s=>active[on?"add":"delete"](s)); }
      else { active.has(st)?active.delete(st):active.add(st); }
      renderFilters(); renderGantt(); renderList(); };
  });
}

function renderList(){
  const rows=visible();
  if(!rows.length){ $("#list").innerHTML=`<div class="empty">표시할 작업이 없습니다.</div>`; return; }
  $("#list").innerHTML=rows.map(t=>{
    const sc=stageColor(t.stage), mile=t.type==="마일스톤";
    if(t.id===editingId){
      return `<div class="item editing">
        <div class="fld" style="margin-bottom:10px"><label>작업명</label><input type="text" class="e_name" value="${(t.name||'').replace(/"/g,'&quot;')}"></div>
        <div class="edit-grid">
          <div class="fld"><label>단계</label><select class="e_stage">${stageOptions(t.stage)}</select></div>
          <div class="fld"><label>유형</label><select class="e_type">${typeOptions(t.type)}</select></div>
          <div class="fld"><label>시작일</label><input type="date" class="e_start" value="${t.start}"></div>
          <div class="fld"><label>종료일</label><input type="date" class="e_end" value="${t.end}"></div>
          <div class="fld"><label>기간(일)</label><input type="number" class="e_dur" min="1" value="${t.duration}"></div>
          <div class="edit-actions">
            <button class="cancelbtn e_cancel">취소</button>
            <button class="savebtn e_save" data-id="${t.id}">저장</button>
          </div>
        </div></div>`;
    }
    return `<div class="item">
      <span class="badge ${sc}">${t.stage}</span>
      <div class="body"><div class="name">${mile?'<span class="star">★</span>':''}${t.name}</div>
        <div class="meta"><span>${t.start} – ${t.end} · ${t.duration}일 · ${t.type}</span>
        <input class="asg" placeholder="담당" value="${(t.assignee||'').replace(/"/g,'&quot;')}" data-id="${t.id}"></div></div>
      <div class="actions">
        <button class="status" data-s="${t.status}" data-id="${t.id}">${t.status}</button>
        <button class="edit" data-id="${t.id}" title="수정">✏️</button>
        <button class="del" data-id="${t.id}" title="삭제">✕</button>
      </div></div>`;
  }).join("");
  $("#list").querySelectorAll(".status").forEach(b=>b.onclick=()=>cycle(b.dataset.id));
  $("#list").querySelectorAll(".del").forEach(b=>b.onclick=()=>removeTask(b.dataset.id));
  $("#list").querySelectorAll(".edit").forEach(b=>b.onclick=()=>startEdit(b.dataset.id));
  $("#list").querySelectorAll(".e_save").forEach(b=>b.onclick=()=>saveEdit(b.dataset.id));
  $("#list").querySelectorAll(".e_cancel").forEach(b=>b.onclick=()=>cancelEdit());
  $("#list").querySelectorAll(".asg").forEach(inp=>{ inp.onblur=()=>saveAssignee(inp.dataset.id,inp.value.trim()); inp.onkeydown=e=>{ if(e.key==='Enter') inp.blur(); }; });
  bindLinks($("#list .e_start"),$("#list .e_end"),$("#list .e_dur"));
  const ne=$("#list .e_name"); if(ne){ ne.focus(); ne.setSelectionRange(ne.value.length,ne.value.length); }
}
function renderAll(){ renderSummary(); renderGantt(); renderList(); }

// ── start/end/duration linkage ──
function bindLinks(s,e,d){
  if(!s||!e||!d) return;
  s.onchange=()=>{ const dur=Math.max(1,Number(d.value)||1); e.value=fmtISO(addDays(pIso(s.value),dur-1)); };
  d.onchange=()=>{ let dur=Math.max(1,Number(d.value)||1); d.value=dur; e.value=fmtISO(addDays(pIso(s.value),dur-1)); };
  e.onchange=()=>{ const sd=pIso(s.value), ed=pIso(e.value); if(ed<sd){ s.value=e.value; d.value=1; } else { d.value=diffDays(sd,ed)+1; } };
}

// ── actions ──
function startEdit(id){ editingId=id; renderList(); }
function cancelEdit(){ editingId=null; renderList(); }
async function saveEdit(id){
  const t=STATE.tasks.find(x=>x.id===id); if(!t) return;
  const box=$("#list");
  const name=box.querySelector(".e_name").value.trim();
  const stage=box.querySelector(".e_stage").value;
  const type=box.querySelector(".e_type").value;
  const start=box.querySelector(".e_start").value;
  let dur=Math.max(1,Number(box.querySelector(".e_dur").value)||1);
  if(!name){ toast('작업명을 입력하세요',true); return; }
  const end=fmtISO(addDays(pIso(start),dur-1));
  const prev={stage:t.stage,name:t.name,type:t.type,start:t.start,end:t.end,duration:t.duration};
  Object.assign(t,{stage,name,type,start,end,duration:dur});
  editingId=null; renderAll(); load(true);
  try{ await apiPost({action:'update',sheet:'tasks',id,data:{stage,name,type,start_date:start,end_date:end,duration:dur}}); toast('✓ 수정 저장'); }
  catch(err){ Object.assign(t,prev); renderAll(); toast('저장 실패: '+err.message,true); }
  finally{ load(false); }
}
async function cycle(id){
  const t=STATE.tasks.find(x=>x.id===id); if(!t) return;
  const prev=t.status; t.status=STATUSES[(STATUSES.indexOf(t.status)+1)%4];
  renderSummary(); renderGantt(); renderList(); load(true);
  try{ await apiPost({action:'update',sheet:'tasks',id,data:{status:t.status}}); toast('✓ 저장됨'); }
  catch(err){ t.status=prev; renderSummary(); renderGantt(); renderList(); toast('저장 실패: '+err.message,true); }
  finally{ load(false); }
}
async function saveAssignee(id,val){
  const t=STATE.tasks.find(x=>x.id===id); if(!t||t.assignee===val) return;
  const prev=t.assignee; t.assignee=val; load(true);
  try{ await apiPost({action:'update',sheet:'tasks',id,data:{assignee:val}}); toast('✓ 담당 저장'); }
  catch(err){ t.assignee=prev; renderList(); toast('저장 실패: '+err.message,true); }
  finally{ load(false); }
}
async function removeTask(id){
  const t=STATE.tasks.find(x=>x.id===id); if(!t) return;
  if(!confirm('"'+t.name+'" 작업을 삭제할까요?')) return;
  const idx=STATE.tasks.indexOf(t); STATE.tasks.splice(idx,1); renderAll(); load(true);
  try{ await apiPost({action:'delete',sheet:'tasks',id}); toast('✓ 삭제됨'); }
  catch(err){ STATE.tasks.splice(idx,0,t); renderAll(); toast('삭제 실패: '+err.message,true); }
  finally{ load(false); }
}
async function addTask(){
  const name=$("#f_name").value.trim();
  if(!name){ toast('작업명을 입력하세요',true); return; }
  const start=$("#f_start").value; let dur=Math.max(1,Number($("#f_dur").value)||1);
  const end=fmtISO(addDays(pIso(start),dur-1));
  const data={ stage:$("#f_stage").value, name, type:$("#f_type").value, start_date:start, end_date:end, duration:dur, assignee:'', status:'미착수', note:'' };
  load(true);
  try{ const res=await apiPost({action:'create',sheet:'tasks',data}); STATE.tasks.push(norm(res.data)); $("#f_name").value=''; $("#addcard").classList.remove('open'); renderAll(); toast('✓ 작업 추가됨'); }
  catch(err){ toast('추가 실패: '+err.message,true); }
  finally{ load(false); }
}

// ── events ──
$("#sort").onchange=e=>{ sortKey=e.target.value; renderGantt(); renderList(); };
$("#toggleAdd").onclick=()=>$("#addcard").classList.toggle('open');
$("#doAdd").onclick=addTask;
$("#tabs").querySelectorAll(".tab").forEach(tb=>{ tb.onclick=()=>{
  $("#tabs").querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x===tb));
  const t=tb.dataset.tab;
  $("#panel-gantt").classList.toggle("hidden",t!=="gantt");
  $("#panel-list").classList.toggle("hidden",t!=="list");
}; });
bindLinks($("#f_start"),$("#f_end"),$("#f_dur"));

// ── init ──
async function init(){
  load(true);
  try{ const data=await apiGetAll(); STATE.tasks=(data.tasks||[]).map(norm); STATE.loaded=true;
    computeStages(); STAGES.forEach(s=>active.add(s));
    $("#f_stage").innerHTML=STAGES.map(s=>`<option>${s}</option>`).join('');
    renderFilters(); renderAll(); }
  catch(err){ $("#errSlot").innerHTML=`<div class="errbox">데이터를 불러오지 못했습니다.<br>${err.message}<br><button onclick="location.reload()">다시 시도</button></div>`; }
  finally{ load(false); }
}
init();
</script>
