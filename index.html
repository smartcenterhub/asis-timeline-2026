<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>애즈이즈투비 런칭 타임라인 · 13주 간트</title>
<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css');
:root{
  --primary:#3182F6; --primary-weak:rgba(49,130,246,.10);
  --bg:#F9FAFB; --surface:#FFFFFF;
  --text:#191F28; --text-muted:#4E5968; --text-faint:#8B95A1;
  --border:#E5E8EB; --border-soft:rgba(0,0,0,.05); --border-strong:#D1D6DB;
  --radius:16px; --radius-sm:8px;
  --tl-col-w:66px; --tl-row-h:30px; --tl-left-w:368px;
  --shadow-sm:0 1px 2px rgba(0,0,0,.04); --shadow-md:0 4px 16px rgba(0,0,0,.08);
}
*{box-sizing:border-box;}
body{margin:0; background:var(--bg); color:var(--text);
  font-family:'Pretendard','맑은 고딕',-apple-system,BlinkMacSystemFont,sans-serif;
  -webkit-font-smoothing:antialiased; font-size:13px; line-height:1.5;}
.page{max-width:1320px; margin:0 auto; padding:24px 20px 60px;}
.hdr{display:flex; align-items:flex-end; justify-content:space-between; flex-wrap:wrap; gap:12px; margin-bottom:16px;}
.hdr-l h1{margin:0; font-size:22px; font-weight:800; letter-spacing:-.02em;}
.hdr-l .sub{margin-top:4px; font-size:12.5px; color:var(--text-muted);}
.hdr-stats{display:flex; gap:8px; flex-wrap:wrap;}
.stat{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm); padding:8px 14px; text-align:center; min-width:62px;}
.stat .num{font-size:18px; font-weight:800; color:var(--primary); line-height:1;}
.stat .lbl{font-size:10.5px; color:var(--text-faint); margin-top:3px;}

/* ── 드래그 시프트 패널 ── */
.vmshift{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm); padding:10px 12px; margin-bottom:12px;}
.vmshift.attach{margin-bottom:8px; border-color:var(--primary-weak); box-shadow:0 1px 0 rgba(49,130,246,.06);}
.vmshift.bottom{margin:8px 0 0;}
.vmshift-info{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:8px; font-size:12px; color:var(--text-muted);}
.vmshift-info b{color:var(--text); font-weight:800;}
.vmshift-delta{font-size:11px; font-weight:700; padding:2px 8px; border-radius:6px; background:var(--bg); color:var(--text-faint);}
.vmshift-delta.move{background:var(--primary-weak); color:var(--primary);}
.vmshift-cap{margin-left:auto; font-size:10.5px; color:var(--text-faint);}
.vmshift .tl-btn{padding:4px 10px;}

.dragbar{--dragbar-accent:49,130,246; position:relative; height:26px; width:100%; box-sizing:border-box;
  background:rgba(var(--dragbar-accent),.05); border:1px solid rgba(var(--dragbar-accent),.22); border-radius:13px;
  cursor:grab; user-select:none; -webkit-user-select:none; touch-action:none; color:#9aa3af; font-size:10.5px;
  font-weight:600; overflow:hidden; transition:background .12s,border-color .12s;}
.dragbar:hover{background:rgba(var(--dragbar-accent),.09); border-color:rgba(var(--dragbar-accent),.4);}
.dragbar.is-dragging{cursor:grabbing;}
.dragbar__hint{position:absolute; top:50%; transform:translateY(-50%); opacity:.65; letter-spacing:.3px; pointer-events:none;}
.dragbar__hint--l{left:12px;} .dragbar__hint--r{right:12px;}
.dragbar__knob{position:absolute; top:50%; left:0; width:16px; height:16px; margin-top:-8px; margin-left:-8px;
  background:rgb(var(--dragbar-accent)); border-radius:50%; opacity:0; pointer-events:none;
  box-shadow:0 2px 8px rgba(var(--dragbar-accent),.5); transition:opacity .2s ease;}
.dragbar.is-dragging .dragbar__knob{opacity:1; transition:opacity .08s ease;}

.bar-row{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:10px;}
.seg{display:inline-flex; background:#EDF0F3; border-radius:9px; padding:3px; gap:2px;}
.seg button{border:none; background:transparent; font-family:inherit; font-size:12px; font-weight:700; color:var(--text-muted); padding:6px 14px; border-radius:7px; cursor:pointer; transition:all .12s;}
.seg button.active{background:#fff; color:var(--primary); box-shadow:var(--shadow-sm);}
.depth{display:inline-flex; align-items:center; gap:6px; flex-wrap:wrap; font-size:11px; color:var(--text-faint); font-weight:700;}
.depth .grp{display:inline-flex; align-items:center; gap:3px; background:var(--surface); border:1px solid var(--border); border-radius:7px; padding:3px 5px;}
.depth .grp span{font-size:10.5px; color:var(--text-muted); font-weight:700; padding:0 3px;}
.depth .grp button{border:none; background:var(--bg); width:22px; height:22px; border-radius:5px; cursor:pointer; font-size:12px; color:var(--text-muted); font-weight:800; line-height:1; transition:all .12s;}
.depth .grp button:hover{background:var(--primary-weak); color:var(--primary);}
.tl-spacer{margin-left:auto;}
.tl-btn{padding:5px 11px; background:var(--bg); border:1px solid var(--border); color:var(--text-muted); font-family:inherit; font-size:11.5px; font-weight:700; border-radius:7px; cursor:pointer; transition:all .12s; white-space:nowrap;}
.tl-btn:hover{background:#fff; border-color:var(--border-strong); color:var(--text);}
.tl-btn.accent{background:var(--primary-weak); border-color:rgba(49,130,246,.2); color:var(--primary);}

.tl-toolbar{display:flex; align-items:center; gap:4px; flex-wrap:wrap; margin-bottom:12px; padding:8px 10px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm);}
.tl-chip{display:inline-flex; align-items:center; gap:5px; padding:5px 9px; border:1px solid transparent; border-radius:7px; background:transparent; font-family:inherit; font-size:11px; font-weight:600; color:var(--text-muted); cursor:pointer; transition:all .12s; white-space:nowrap;}
.tl-chip:hover{background:var(--bg);}
.tl-chip.active{background:var(--primary-weak); border-color:rgba(49,130,246,.25); color:var(--primary);}
.tl-chip-dot{width:9px; height:9px; border-radius:3px; flex-shrink:0;}

.tl-wrap{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); overflow:auto; max-height:calc(100vh - 300px); position:relative; box-shadow:var(--shadow-sm);}
.tl-grid{display:grid; grid-template-columns:var(--tl-left-w) 1fr;}
.tl-axis-corner{position:sticky; top:0; left:0; z-index:30; background:#fff; border-right:1px solid var(--border); border-bottom:1px solid var(--border); padding:0 14px; font-size:10.5px; color:var(--text-faint); font-weight:700; letter-spacing:.03em; display:flex; align-items:center;}
.tl-axis-bar{position:sticky; top:0; z-index:20; background:#fff; border-bottom:1px solid var(--border);}
.tl-axis-top{display:flex; border-bottom:1px solid var(--border-soft); height:22px;}
.tl-axis-topcell{border-right:1px solid var(--border-soft); padding:0 6px; font-size:10.5px; font-weight:700; color:var(--text-muted); display:flex; align-items:center; gap:5px; flex-shrink:0; overflow:hidden;}
.tl-axis-topcell .mn{font-size:9px; color:var(--text-faint); font-weight:600;}
.tl-axis-topcell.wkbound{border-right:1px solid var(--border);}
.tl-axis-cells{display:flex; height:34px;}
.tl-axis-cell{width:var(--tl-col-w); flex-shrink:0; border-right:1px solid var(--border-soft); padding:4px 0; text-align:center; line-height:1.2;}
.tl-axis-cell.curr{background:var(--primary-weak);}
.tl-axis-cell.we{background:rgba(0,0,0,.022);}
.tl-axis-cell.wkbound{border-right:1px solid var(--border);}
.tl-axis-cell .c1{font-size:11px; font-weight:800; color:var(--text);}
.tl-axis-cell.curr .c1{color:var(--primary);}
.tl-axis-cell.we .c2{color:#E5484D;}
.tl-axis-cell .c2{font-size:8.5px; color:var(--text-faint); margin-top:1px;}

.tl-row-label{position:sticky; left:0; z-index:10; background:#fff; border-right:1px solid var(--border); border-bottom:1px solid var(--border-soft); height:var(--tl-row-h); display:flex; align-items:center; gap:6px; font-size:12px; cursor:pointer; overflow:hidden; padding-right:10px;}
.tl-row-label:hover{background:var(--primary-weak);}
.tl-row-label.lv1{font-weight:800; background:#F2F4F6; font-size:12.5px; padding-left:12px;}
.tl-row-label.lv1:hover{background:#EAEDF0;}
.tl-row-label.lv2{font-weight:600; background:#FAFBFC; padding-left:30px; font-size:11.5px;}
.tl-row-label.lv3{padding-left:52px; color:var(--text-muted); font-size:11.5px;}
.tl-arrow{font-size:8px; color:var(--text-faint); transition:transform .15s; width:10px; flex-shrink:0; text-align:center;}
.tl-row-label.collapsed .tl-arrow{transform:rotate(-90deg);}
.tl-cat-icon{width:18px; height:18px; border-radius:5px; color:#fff; font-size:10px; font-weight:800; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.tl-dot{width:6px; height:6px; border-radius:50%; flex-shrink:0;}
.tl-name{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.tl-meta{font-size:9.5px; color:var(--text-faint); flex-shrink:0;}
.tl-badge{font-size:9px; font-weight:700; padding:1px 5px; border-radius:4px; flex-shrink:0; letter-spacing:.02em;}
.tl-badge.g-필수{background:#FEE2E2; color:#DC2626;}
.tl-badge.g-착수{background:#DBEAFE; color:#2563EB;}
.tl-badge.g-진행{background:#E5E7EB; color:#6B7280;}

.tl-row-track{position:relative; height:var(--tl-row-h); border-bottom:1px solid var(--border-soft);}
.tl-row-track.lv1{background:rgba(0,0,0,.018);}
.tl-row-track.lv2{background:rgba(0,0,0,.008);}
.tl-row-track .grid-bg{position:absolute; inset:0; pointer-events:none;}
.tl-today-line{position:absolute; top:0; bottom:0; width:2px; background:var(--primary); box-shadow:0 0 8px rgba(49,130,246,.45); z-index:4; pointer-events:none;}
.tl-today-line.edge{background:repeating-linear-gradient(180deg,var(--primary) 0 4px,transparent 4px 8px); box-shadow:none; opacity:.7;}
.tl-today-flag{position:absolute; top:-1px; transform:translateX(-50%); z-index:21; background:var(--primary); color:#fff; font-size:9px; font-weight:800; padding:2px 6px; border-radius:0 0 5px 5px; white-space:nowrap; pointer-events:none;}
.tl-today-flag.edge{background:#8B95A1;}
.tl-bar{position:absolute; top:5px; height:calc(var(--tl-row-h) - 10px); border-radius:5px; padding:0 7px; display:flex; align-items:center; color:#fff; font-size:10px; font-weight:700; cursor:pointer; transition:transform .1s,box-shadow .1s; overflow:hidden; white-space:nowrap; z-index:2;}
.tl-bar:hover{transform:translateY(-1px); box-shadow:var(--shadow-md); z-index:5;}
.tl-bar.must{box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.6);}
.tl-bar-text{position:relative; z-index:1; overflow:hidden; text-overflow:ellipsis;}
.tl-group-bar{position:absolute; top:13px; height:5px; border-radius:3px; opacity:.45; z-index:1; pointer-events:none;}
.tl-group-bar.lv2{height:6px; opacity:.6;}

.tl-list{padding:6px 0;}
.tl-wk-block{border-bottom:1px solid var(--border-soft);}
.tl-wk-head{position:sticky; top:0; z-index:5; background:#F2F4F6; padding:9px 16px; display:flex; align-items:center; gap:10px; border-bottom:1px solid var(--border);}
.tl-wk-head.curr{background:var(--primary-weak);}
.tl-wk-no{font-size:14px; font-weight:800; color:var(--text);}
.tl-wk-head.curr .tl-wk-no{color:var(--primary);}
.tl-wk-date{font-size:11px; color:var(--text-muted); font-weight:600;}
.tl-wk-cnt{margin-left:auto; font-size:10.5px; color:var(--text-faint); font-weight:700; background:#fff; padding:2px 9px; border-radius:10px;}
.tl-li{display:flex; align-items:center; gap:9px; padding:9px 16px 9px 18px; cursor:pointer; border-bottom:1px solid var(--border-soft); transition:background .1s;}
.tl-li:last-child{border-bottom:none;}
.tl-li:hover{background:var(--primary-weak);}
.tl-li .tl-cat-icon{width:20px; height:20px;}
.tl-li-main{flex:1; min-width:0;}
.tl-li-sub{font-size:13px; font-weight:700; color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.tl-li-work{font-size:11px; color:var(--text-faint); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-top:1px;}
.tl-li-span{font-size:10px; color:var(--text-faint); font-weight:700; flex-shrink:0; background:var(--bg); padding:2px 7px; border-radius:5px;}

.tl-modal-bg{position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:100; display:flex; align-items:center; justify-content:center; padding:20px; opacity:0; pointer-events:none; transition:opacity .15s;}
.tl-modal-bg.show{opacity:1; pointer-events:auto;}
.tl-modal{background:#fff; border-radius:var(--radius); width:100%; max-width:480px; max-height:84vh; overflow:auto; box-shadow:0 12px 40px rgba(0,0,0,.2); transform:translateY(8px) scale(.98); transition:transform .15s;}
.tl-modal-bg.show .tl-modal{transform:none;}
.tl-modal-hd{padding:18px 20px 14px; border-bottom:1px solid var(--border); position:relative;}
.tl-modal-cat{display:inline-flex; align-items:center; gap:6px; font-size:11px; font-weight:700; color:var(--text-muted); margin-bottom:8px;}
.tl-modal-cat .tl-cat-icon{width:16px; height:16px; font-size:9px;}
.tl-modal-hd h3{margin:0; font-size:16px; font-weight:800; letter-spacing:-.01em; padding-right:30px;}
.tl-modal-hd .work{font-size:11.5px; color:var(--text-faint); margin-top:4px;}
.tl-modal-x{position:absolute; top:16px; right:16px; width:26px; height:26px; border:none; background:var(--bg); border-radius:7px; font-size:16px; color:var(--text-muted); cursor:pointer; line-height:1;}
.tl-modal-x:hover{background:var(--border);}
.tl-modal-bd{padding:16px 20px 20px;}
.tl-field{display:flex; gap:10px; padding:9px 0; border-bottom:1px solid var(--border-soft); font-size:12.5px;}
.tl-field:last-child{border-bottom:none;}
.tl-field .k{width:72px; flex-shrink:0; color:var(--text-faint); font-weight:600; font-size:11.5px;}
.tl-field .v{flex:1; color:var(--text); line-height:1.55;}

footer{margin-top:18px; text-align:center; font-size:11px; color:var(--text-faint);}
footer b{color:var(--text-muted); font-weight:700;}
@media (max-width:640px){.page{padding:16px 12px 50px;} :root{--tl-left-w:200px;} .hdr-l h1{font-size:18px;}}
</style>
</head>
<body>
<div class="page">
  <div class="hdr">
    <div class="hdr-l">
      <h1>애즈이즈투비 런칭 타임라인</h1>
      <div class="sub">13주 통합 간트 · 폼 클렌저 (125ml 튜브, OEM) · 정식 런칭 2026.08.31 · 드래그바로 구간 이동</div>
    </div>
    <div class="hdr-stats" id="stats"></div>
  </div>

  <div class="bar-row" id="controls"></div>
  <div class="tl-toolbar" id="toolbar"></div>

  <!-- 상단 드래그바 — 필터 바로 아래·간트 바로 위 (구간 이동 스크롤) -->
  <div class="vmshift attach" id="shiftTop">
    <div class="vmshift-info">
      <span>↔ 구간 이동 — 바를 끌어 다음/이전 기간 보기 · <b>오른쪽 = 다음(미래)</b></span>
      <span class="vmshift-delta move" id="roView">보임 W1–W?</span>
      <button class="tl-btn" id="firstBtn">↞ 맨 앞</button>
      <span class="vmshift-cap">날짜·주차·막대 한 몸으로 좌우 이동</span>
    </div>
    <div class="dragbar" id="dragTop" title="좌우로 끌어서 다음/이전 기간 보기">
      <span class="dragbar__hint dragbar__hint--l">◀ 이전</span>
      <span class="dragbar__knob" data-dragbar-knob></span>
      <span class="dragbar__hint dragbar__hint--r">다음 ▶</span>
    </div>
  </div>
  <div class="tl-wrap" id="board"></div>

  <!-- 하단 드래그바 (구간 이동 스크롤) -->
  <div class="vmshift bottom" id="shiftBot">
    <div class="dragbar" id="dragBot" title="좌우로 끌어서 다음/이전 기간 보기">
      <span class="dragbar__hint dragbar__hint--l">◀ 이전</span>
      <span class="dragbar__knob" data-dragbar-knob></span>
      <span class="dragbar__hint dragbar__hint--r">다음 ▶</span>
    </div>
  </div>

  <footer>전 항목 상태 <b>예정</b> · 구분: <span class="tl-badge g-필수">필수</span> <span class="tl-badge g-착수">착수</span> <span class="tl-badge g-진행">진행</span> &nbsp;·&nbsp; 출처: asisstobe_launch_timeline_260605 &nbsp;·&nbsp; <b>김규빈 × Claude</b></footer>
</div>

function buildTree(rows){

  const top=el('div',{class:'tl-axis-top'}); const cells=el('div',{class:'tl-axis-cells'});
  if(ST.view==='day'){
    WEEKS.forEach(w=>top.appendChild(el('div',{class:'tl-axis-topcell wkbound',style:{width:'calc(var(--tl-col-w) * 7)'}},['W'+w.w, el('span',{class:'mn'},w.mon)])));
    DAYS.forEach(dd=>cells.appendChild(el('div',{class:'tl-axis-cell'+(dd.we?' we':'')+(dd.i===off?' curr':'')+(dd.i%7===6?' wkbound':'')},
      [el('div',{class:'c1'},String(dd.d)), el('div',{class:'c2'},dd.dow)])));
  } else {
    const mg=[]; let cur=null;
    WEEKS.forEach(w=>{if(cur&&cur.m===w.month)cur.n++; else{cur={m:w.month,n:1}; mg.push(cur);}});
    mg.forEach(g=>top.appendChild(el('div',{class:'tl-axis-topcell',style:{width:'calc(var(--tl-col-w) * '+g.n+')'}},[g.m+'월',el('span',{class:'mn'},g.n+'주')])));
    const curWk=(off>=0&&off<ND)?Math.floor(off/7)+1:-1;
    WEEKS.forEach(w=>cells.appendChild(el('div',{class:'tl-axis-cell'+(w.w===curWk?' curr':'')},[el('div',{class:'c1'},'W'+w.w), el('div',{class:'c2'},w.mon)])));
  }
  axis.appendChild(top); axis.appendChild(cells);
  const tp=todayPos(ST.view);
  axis.appendChild(el('div',{class:'tl-today-flag'+(tp.state!=='in'?' edge':''),style:{left:'calc(var(--tl-left-w) + var(--tl-col-w) * '+tp.cols+')'}},tp.label));
  grid.appendChild(axis);

  function gridBg(){const e=el('div',{class:'grid-bg'});
    if(ST.view==='day'){
      e.style.backgroundImage='linear-gradient(to right,var(--border) 1px,transparent 1px),linear-gradient(to right,var(--border-soft) 1px,transparent 1px)';
      e.style.backgroundSize='calc(var(--tl-col-w) * 7) 100%, var(--tl-col-w) 100%';
    } else {
      e.style.backgroundImage='linear-gradient(to right,var(--border-soft) 1px,transparent 1px)';
      e.style.backgroundSize='var(--tl-col-w) 100%';
    } return e;}

  const cats=TREE.filter(c=>ST.filter==='all'||c.name===ST.filter);
  cats.forEach(c=>{
    const m=CAT[c.name]; const ccol=ST.collapsedCat[c.name];
    const l1=el('div',{class:'tl-row-label lv1'+(ccol?' collapsed':''),onclick:()=>{ST.collapsedCat[c.name]=!ccol; render();}},[
      el('span',{class:'tl-arrow'},'▼'), el('div',{class:'tl-cat-icon',style:{background:m.color}},m.icon),
      el('span',{class:'tl-name'},c.name), el('span',{class:'tl-meta'},'W'+c.sw+'–W'+c.ew)]);
    const t1=el('div',{class:'tl-row-track lv1'},[gridBg(), groupBar(c,m.color), todayLine()]);
    grid.appendChild(l1); grid.appendChild(t1);
    if(ccol) return;
    c.works.forEach(w=>{
      const wkey=c.name+'|'+w.name; const wcol=ST.collapsedWork[wkey]; const single=w.subs.length===1;
      const l2=el('div',{class:'tl-row-label lv2'+(wcol?' collapsed':''),
        onclick:()=>{ if(single){openModal(w.subs[0]);} else {ST.collapsedWork[wkey]=!wcol; render();} }},[
        el('span',{class:'tl-arrow'},single?'·':'▼'),
        el('span',{class:'tl-name',title:w.name},w.name), el('span',{class:'tl-meta'},'W'+w.sw+'–W'+w.ew)]);
      const t2=el('div',{class:'tl-row-track lv2'},[gridBg(), single?mkBar(w.subs[0],m.color):groupBar(w,m.color,true), todayLine()]);
      grid.appendChild(l2); grid.appendChild(t2);
      if(wcol||single) return;
      w.subs.forEach(r=>{
        const l3=el('div',{class:'tl-row-label lv3',onclick:()=>openModal(r)},[
          el('span',{class:'tl-dot',style:{background:m.color}}),
          el('span',{class:'tl-name',title:r.sub},r.sub),
          r.gubun?el('span',{class:'tl-badge g-'+r.gubun},r.gubun):null]);
        const t3=el('div',{class:'tl-row-track'},[gridBg(), mkBar(r,m.color), todayLine()]);
        grid.appendChild(l3); grid.appendChild(t3);
      });
    });
  });
  board.appendChild(grid);
}

function renderList(board){
  const WEEKS=curWeeks(); const off=todayOff(); const curWk=(off>=0&&off<ND)?Math.floor(off/7)+1:-1;
  const list=el('div',{class:'tl-list'});
  const rows=D.rows.filter(r=>ST.filter==='all'||r.cat===ST.filter);
  WEEKS.forEach(wk=>{
    const inWk=rows.filter(r=>r.sw===wk.w).sort((a,b)=>CAT_ORDER.indexOf(a.cat)-CAT_ORDER.indexOf(b.cat));
    if(!inWk.length) return;
    const block=el('div',{class:'tl-wk-block'});
    block.appendChild(el('div',{class:'tl-wk-head'+(wk.w===curWk?' curr':'')},[
      el('span',{class:'tl-wk-no'},'W'+wk.w),
      el('span',{class:'tl-wk-date'},wk.mon+'~'+wk.fri+' · '+wk.month+'월'),
      el('span',{class:'tl-wk-cnt'},inWk.length+'건')]));
    inWk.forEach(r=>{const m=CAT[r.cat]; const span=r.sw===r.ew?('W'+r.sw):('W'+r.sw+'–W'+r.ew);
      block.appendChild(el('div',{class:'tl-li',onclick:()=>openModal(r)},[
        el('div',{class:'tl-cat-icon',style:{background:m.color}},m.icon),
        el('div',{class:'tl-li-main'},[el('div',{class:'tl-li-sub'},r.sub),el('div',{class:'tl-li-work'},r.cat+' › '+r.work)]),
        r.gubun?el('span',{class:'tl-badge g-'+r.gubun},r.gubun):null,
        el('span',{class:'tl-li-span'},span)]));});
    list.appendChild(block);
  });
  board.appendChild(list);
}

function openModal(r){
  const m=CAT[r.cat]||{color:'#888',icon:'?'};
  const sd=md(addDays(ANCHOR,r.sdi)), ed=md(addDays(ANCHOR,r.edi));
  const modal=document.getElementById('modal'); modal.innerHTML='';
  const field=(k,v)=>v?el('div',{class:'tl-field'},[el('div',{class:'k'},k),el('div',{class:'v'},v)]):null;
  modal.appendChild(el('div',{class:'tl-modal-hd'},[
    el('button',{class:'tl-modal-x',onclick:closeModal},'×'),
    el('div',{class:'tl-modal-cat'},[el('div',{class:'tl-cat-icon',style:{background:m.color}},m.icon),r.cat]),
    el('h3',{},r.sub), el('div',{class:'work'},'작업 · '+r.work)]));
  const bd=el('div',{class:'tl-modal-bd'});
  [ field('작업 내용',r.desc),
    field('기간','W'+r.sw+'–W'+r.ew+'  ('+sd+' ~ '+ed+')'+(r.dur?' · '+r.dur:'')),
    r.gubun?el('div',{class:'tl-field'},[el('div',{class:'k'},'구분'),el('div',{class:'v'},[el('span',{class:'tl-badge g-'+r.gubun,style:{fontSize:'11px',padding:'2px 8px'}},r.gubun)])]):null,
    field('상태',r.status), field('선행작업',(r.pre&&r.pre!=='-')?r.pre:'없음'),
    field('담당',r.owner), field('비고',r.note)
  ].filter(Boolean).forEach(f=>bd.appendChild(f));
  modal.appendChild(bd);
  document.getElementById('modalBg').classList.add('show');}
function closeModal(){document.getElementById('modalBg').classList.remove('show');}
document.getElementById('modalBg').addEventListener('click',e=>{if(e.target.id==='modalBg')closeModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});

function updateVisible(){
  const board=document.getElementById('board'); if(!board)return;
  const ro=document.getElementById('roView'); if(!ro)return;
  if(ST.view==='list'){ ro.textContent='주차별 리스트'; return; }
  const colw=COLW[ST.view]; const sl=board.scrollLeft;
  const corner=board.querySelector('.tl-axis-corner'); const leftW=corner?corner.offsetWidth:368;
  const firstCol=Math.floor(sl/colw);
  const visCols=Math.max(1, Math.floor((board.clientWidth-leftW)/colw));
  let a,b;
  if(ST.view==='day'){ a=Math.floor(firstCol/7)+1; b=Math.floor((firstCol+visCols-1)/7)+1; }
  else { a=firstCol+1; b=firstCol+visCols; }
  a=Math.max(1,Math.min(NW,a)); b=Math.max(a,Math.min(NW,b));
  const W=curWeeks();
  ro.textContent='보임 W'+a+'–W'+b+' · '+W[a-1].mon+'~'+W[b-1].fri;
}

function render(){
  renderControls(); renderToolbar();
  const board=document.getElementById('board'); board.innerHTML='';
  if(ST.view==='list') renderList(board); else renderGantt(board);
  updateVisible();
}

/* ── 구간 이동 팬바 (오른쪽=다음/미래) ── */
const PAN_FACTOR=2;
function createPanBar(barEl, board){
  if(!barEl||!board) return;
  const knob=barEl.querySelector('[data-dragbar-knob]');
  let startX=null, startScroll=0, pid=null;
  function setKnob(cx){if(!knob)return; const r=barEl.getBoundingClientRect(); knob.style.left=Math.max(0,Math.min(r.width,cx-r.left))+'px';}
  function down(e){if(startX!==null)return; startX=e.clientX; startScroll=board.scrollLeft; pid=e.pointerId; setKnob(e.clientX); barEl.classList.add('is-dragging'); if(barEl.setPointerCapture)barEl.setPointerCapture(e.pointerId); e.preventDefault();}
  function move(e){if(startX===null||e.pointerId!==pid)return; setKnob(e.clientX); board.scrollLeft=startScroll+(e.clientX-startX)*PAN_FACTOR;}  /* 오른쪽 끌기 → scrollLeft↑ → 다음(미래) */
  function up(e){if(startX===null)return; if(e.pointerId!=null&&e.pointerId!==pid)return; startX=null; pid=null; barEl.classList.remove('is-dragging');}
  barEl.addEventListener('pointerdown',down); barEl.addEventListener('pointermove',move);
  barEl.addEventListener('pointerup',up); barEl.addEventListener('pointercancel',up);
}
const boardEl=document.getElementById('board');
createPanBar(document.getElementById('dragTop'), boardEl);
createPanBar(document.getElementById('dragBot'), boardEl);
boardEl.addEventListener('scroll', updateVisible);
document.getElementById('firstBtn').addEventListener('click', function(){ boardEl.scrollTo({left:0, behavior:'smooth'}); });

renderStats(); render(); scrollToday();
</script>
